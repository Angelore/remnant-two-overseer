name: .NET

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: 10.0.x
      PROJECT: ./RemnantOverseer/RemnantOverseer.csproj
      ARTIFACT_DIR: ./artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Set Release Variables
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
            assembly_version="$version"
            release_tag="$REF_NAME"
            release_draft="false"
            release_prerelease="false"
          else
            short_sha="${SHA::7}"
            version="0.0.0-dev.sha${short_sha}"
            assembly_version="0.0.0.0"
            release_tag="v${version}"
            release_draft="true"
            release_prerelease="true"
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSEMBLY_VERSION=$assembly_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_DRAFT=$release_draft" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$release_prerelease" >> "$GITHUB_ENV"

      - name: Publish Linux
        run: |
          dotnet publish $PROJECT \
            -c Release \
            --runtime linux-x64 \
            --output $ARTIFACT_DIR/linux \
            -p:PublishSingleFile=true \
            -p:SelfContained=false \
            -p:Version=$VERSION \
            -p:AssemblyVersion=$ASSEMBLY_VERSION

      - name: Publish Windows
        run: |
          dotnet publish $PROJECT \
            -c Release \
            --runtime win-x64 \
            --output $ARTIFACT_DIR/windows \
            -p:PublishSingleFile=true \
            -p:SelfContained=false \
            -p:Version=$VERSION \
            -p:AssemblyVersion=$ASSEMBLY_VERSION

      - name: Create Linux artifact
        run: |
          tar -C $ARTIFACT_DIR/linux -czvf RemnantOverseer-${RELEASE_TAG}-linux.tar.gz .

      - name: Create Windows artifact
        run: |
          cd $ARTIFACT_DIR/windows
          zip -r "$GITHUB_WORKSPACE/RemnantOverseer-${RELEASE_TAG}-windows.zip" .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: ${{ env.RELEASE_DRAFT }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          files: |
            RemnantOverseer-${{ env.RELEASE_TAG }}-linux.tar.gz
            RemnantOverseer-${{ env.RELEASE_TAG }}-windows.zip
